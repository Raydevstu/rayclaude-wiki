<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tier-1 Control Plane</title>
<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#14181f;--mu:#5d6675;--ac:#2f5bea;--bd:#dde1e8;--ok:#13804a;--er:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--sf:#171b22;--tx:#e8ebf0;--mu:#97a1b1;--ac:#7c9bff;--bd:#2a313c;--ok:#4cc388;--er:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,sans-serif}
header,main{max-width:1100px;margin:0 auto;padding:14px 18px}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;flex:1}nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
button,input,textarea,select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:7px 12px}
button{cursor:pointer}button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
textarea{width:100%;min-height:90px}.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12.5px/1.5 ui-monospace,monospace}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px 8px;border-top:1px solid var(--bd);vertical-align:top}
.m{color:var(--mu)}.ok{color:var(--ok)}.er{color:var(--er)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.k{display:inline-block;margin-right:18px}.k b{display:block;font-size:20px}
</style></head><body>
<header><h1>Tier-1 Control Plane</h1><input id="tk" type="password" placeholder="API token (if enabled)" style="width:220px"><span id="hl" class="m"></span></header>
<main><nav id="nv"></nav><div id="v"></div></main>
<script>
const $=s=>document.querySelector(s),E=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='run';$('#tk').value=sessionStorage.getItem('t')||'';
const api=async(p,o={})=>{sessionStorage.setItem('t',$('#tk').value);const sid=sessionStorage.getItem('sandbox_id');if(sid&&p.startsWith('/v1/guard/snapshot'))p+=(p.includes('?')?'&':'?')+'sandbox_id='+encodeURIComponent(sid);if(sid&&p=='/v1/guard/approval'||sid&&p=='/v1/guard/write'){const body=JSON.parse(o.body||'{}');body.sandbox_id=sid;o={...o,body:JSON.stringify(body)};}const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('#tk').value}});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail||r.status));return j};
const T=[['run','Run'],['runs','Runs'],['approval','Mission Control'],['usage','Usage'],['skills','Skills'],['jobs','Jobs'],['kb','Notebooks'],['chat','Chat'],['ledger','Ledger']];
const nav=()=>{$('#nv').innerHTML=T.map(t=>`<button class="${tab==t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
 $('#nv').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;show()})};
const usd=n=>'$'+Number(n||0).toFixed(5);
async function show(){nav();const v=$('#v');v.innerHTML='<div class="m">Loading…</div>';
 try{
 if(tab=='run'){v.innerHTML=`<div class="card"><textarea id="p" placeholder="Prompt. Include URLs to research them, or 'file:notes.txt' to read from the sandbox."></textarea>
  <div class="row"><select id="t"><option value="">auto tier</option><option>small</option><option>medium</option><option>large</option></select><select id="m"><option value="">autopilot</option><option>ralph</option><option>team</option><option>plan</option></select><button class="p" id="go">Run</button><span id="st" class="m"></span></div></div><div id="o"></div>`;
  $('#go').onclick=async()=>{$('#st').textContent='running…';$('#go').disabled=true;try{const r=await api('/v1/run',{method:'POST',body:JSON.stringify({prompt:$('#p').value,tier:$('#t').value||null,mode:$('#m').value||null})});
   $('#o').innerHTML=`<div class="card"><div><span class="k"><b class="${r.status=='ok'?'ok':'er'}">${r.status}</b>status</span><span class="k"><b>${r.audit?.score??'–'}</b>audit</span><span class="k"><b>${usd(r.usage.cost_usd)}</b>cost</span>
   <span class="k"><b>${r.savings?.saved_pct??'–'}%</b>saved vs baseline</span><span class="k"><b>${r.usage.calls}</b>model calls</span>${r.cached?'<span class="k"><b>cache</b>hit</span>':''}${r.provider=='mock'?'<span class="k er"><b>mock</b>provider</span>':''}</div></div>
   <div class="card"><pre>${E(r.answer)}</pre></div><div class="card"><div class="m">Mode: ${E(r.mode||'autopilot')}${r.iterations?' ('+r.iterations+' iterations, '+(r.verified?'verified':'NOT verified')+')':''} · Skills: ${E((r.skills||[]).join(', ')||'none')} · run ${E(r.run_id)}</div>
   ${r.subtasks?'<table>'+r.subtasks.map(s=>`<tr><td>${E(s.prompt.slice(0,90))}</td><td class="${s.status=='ok'?'ok':'er'}">${s.status}</td><td class="m">${E(s.run_id||'')}</td></tr>`).join('')+'</table>':''}
   <table>${(r.workers||[]).map(w=>`<tr><td>${E(w.name)}</td><td class="${w.ok?'ok':'er'}">${w.ok?'ok':'failed'}</td><td>${E(w.summary)} ${E(w.error)}</td><td class="m">${w.raw_tokens}→${w.kept_tokens} tok</td></tr>`).join('')}</table></div>`;$('#st').textContent=''}catch(e){$('#st').textContent=e.message}$('#go').disabled=false}}
 if(tab=='runs'){const r=await api('/v1/runs');v.innerHTML=`<div class="card"><table><tr><th>Run</th><th>Status</th><th>Trigger</th><th>Prompt</th><th>Cost</th></tr>${r.map(x=>`<tr><td><a href="#" data-r="${x.id}">${x.id}</a></td><td class="${x.status=='ok'?'ok':x.status=='failed'?'er':''}">${x.status}</td><td>${E(x.trigger)}</td><td>${E(x.prompt)}</td><td>${usd(x.actual_cost)}</td></tr>`).join('')}</table></div><div id="cp"></div>`;
  v.querySelectorAll('[data-r]').forEach(a=>a.onclick=async e=>{e.preventDefault();const c=await api('/v1/runs/'+a.dataset.r+'/capsule').catch(x=>({error:x.message}));$('#cp').innerHTML=`<div class="card"><div class="m">Task capsule</div><pre>${E(JSON.stringify(c,null,2))}</pre></div>`})}
 if(tab=='approval'){const history=await api('/v1/guard/approvals');v.innerHTML=`<div class="card"><b>Mission Control approval brief</b><p class="m">Prepare a read-only agent proposal, then persist it for explicit approval. File writes stay disabled by default.</p><textarea id="ag" placeholder="Goal"></textarea><textarea id="af" placeholder='Proposed files JSON, e.g. {"LAB/example.txt":"new content"}'></textarea><div class="row"><input id="ab" value="main" placeholder="branch"><input id="ac" placeholder="commit"><input id="aa" value="LAB/example.txt" placeholder="AI files, comma separated"><input id="ar" placeholder="Agent run ID (prepared)" readonly><button class="p" id="prepare">Prepare agent proposal</button><button class="p" id="ap">Preview and persist</button><span id="ae" class="m"></span></div><pre id="agent" class="m"></pre></div><div class="card"><b>Persisted proposals</b><table><tr><th>ID</th><th>Status</th><th>Recorded</th></tr>${history.map(x=>`<tr><td><a href="#" data-approval="${E(x.id)}">${E(x.id.slice(0,12))}…</a></td><td>${E(x.status)}</td><td>${new Date(x.ts*1000).toISOString()}</td></tr>`).join('')||'<tr><td colspan="3" class="m">No records</td></tr>'}</table></div><div id="ao"></div>`;
  const render= r=>{const b=r.body||r;const id=r.approval_id||r.id;const approved=r.status=='APPROVED';const enabled=Boolean(b.writes_enabled);$('#ao').innerHTML=`<div class="card"><b class="${r.status=='REVIEW'||approved?'ok':'er'}">${E(r.status)}</b><p>Record ${E(id)} · ${E(b.write_execution)} · writes enabled: ${enabled?'yes':'no'} · agent: ${E(b.agent?.run_id||'none')}</p><h3>Final approval gate</h3><pre>${E(JSON.stringify({explicit_approval:Boolean(b.explicit_approval),agent:b.agent,repository:b.repository,evidence_level:b.evidence_level,rollback:b.rollback?.status,write_execution:b.write_execution,post_write_evidence:b.post_write_evidence,rollback_execution:b.rollback_execution},null,2))}</pre>${r.status=='REVIEW'?'<button class="p" id="approve">Explicitly approve record</button>':''}${approved?`<div class="card"><b>Controlled write execution</b><p class="m">The request must match this persisted record, current Git identity, agent run, and file digests. Backend writes are disabled unless TIER1_GUARD_WRITES=1.</p><button class="p" id="execute" ${enabled?'':'disabled'}>Execute approved write</button><span id="we" class="m">${enabled?'':'Disabled by default'}</span>${b.write_audit_id?'<br><button id="rollback">Rollback audited write</button> <span id="rb" class="m"></span>':''}</div>`:''}<h3>Ownership</h3><pre>${E(JSON.stringify(b.ownership,null,2))}</pre><h3>Proposed diff</h3><pre>${E(JSON.stringify(b.files,null,2))}</pre><h3>Risks</h3><pre>${E(JSON.stringify(b.risks,null,2))}</pre><h3>Rollback</h3><pre>${E(JSON.stringify(b.rollback,null,2))}</pre></div>`;if($('#approve'))$('#approve').onclick=async()=>{try{await api('/v1/guard/approvals/'+id+'/approve',{method:'POST'});render(await api('/v1/guard/approvals/'+id));}catch(e){alert(e.message)}};if($('#execute'))$('#execute').onclick=async()=>{try{const ai=(b.ownership.ai_files||[]);const files={};(b.files||[]).filter(x=>x.owner=='ai').forEach(x=>files[x.path]=x.proposed);const digests={};(b.files||[]).forEach(x=>digests[x.path]=x.baseline_digest);await api('/v1/guard/write',{method:'POST',body:JSON.stringify({approval_id:id,approved:true,agent_run_id:b.agent?.run_id||null,branch:b.repository.branch,commit:b.repository.commit,files,ai_files:ai,protected_user_files:b.ownership.protected_user_files||[],baseline_digests:digests})});render(await api('/v1/guard/approvals/'+id));}catch(e){$('#we').textContent=e.message}};if($('#rollback'))$('#rollback').onclick=async()=>{const button=$('#rollback');if(button.dataset.confirmed!=='yes'){button.dataset.confirmed='yes';button.textContent='Confirm rollback';$('#rb').textContent='Click again to confirm rollback';return}try{const out=await api('/v1/guard/approvals/'+id+'/rollback',{method:'POST',body:JSON.stringify({approved:true})});$('#rb').textContent=out.status+' · '+out.reason;render(await api('/v1/guard/approvals/'+id));}catch(e){$('#rb').textContent=e.message}}};
  $('#prepare').onclick=async()=>{try{const out=await api('/v1/guard/agent/prepare',{method:'POST',body:JSON.stringify({prompt:$('#ag').value||'Review proposed change'})});$('#ar').value=out.run_id||'';$('#agent').textContent=JSON.stringify({status:out.status,run_id:out.run_id,evidence_level:out.evidence_level,write_execution:out.write_execution},null,2);if(out.status!='ok')$('#ae').textContent='Agent preparation did not complete';}catch(e){$('#ae').textContent=e.message}};
  $('#ap').onclick=async()=>{try{const files=JSON.parse($('#af').value||'{}');const ai=$('#aa').value.split(',').map(x=>x.trim()).filter(Boolean);const snap=await api('/v1/guard/snapshot?paths='+encodeURIComponent(ai.join(',')));const digests={};ai.forEach(x=>digests[x]=snap.files[x]?.digest||'missing');render(await api('/v1/guard/approval',{method:'POST',body:JSON.stringify({goal:$('#ag').value||'Review proposed change',branch:$('#ab').value,commit:$('#ac').value||snap.repository.commit,agent_run_id:$('#ar').value||null,files,ai_files:ai,protected_user_files:[],baseline_digests:digests})}));}catch(e){$('#ae').textContent=e.message}};
  v.querySelectorAll('[data-approval]').forEach(a=>a.onclick=async e=>{e.preventDefault();render(await api('/v1/guard/approvals/'+a.dataset.approval))})}
 if(tab=='usage'){const u=await api('/v1/usage');v.innerHTML=`<div class="card"><span class="k"><b>${usd(u.spend_today_usd)}</b>spend today</span><span class="k"><b>${u.saved_pct??'–'}%</b>measured saving (${u.measured_runs} runs)</span><span class="k"><b>${usd(u.baseline_cost_usd)}</b>baseline</span><span class="k"><b>${usd(u.actual_cost_usd)}</b>actual</span></div>
  <div class="card"><table><tr><th>Tier</th><th>Calls</th><th>In</th><th>Out</th><th>Cost</th></tr>${u.by_tier.map(t=>`<tr><td>${t.tier}</td><td>${t.calls}</td><td>${t.in_tok}</td><td>${t.out_tok}</td><td>${usd(t.cost)}</td></tr>`).join('')}</table></div>
  <div class="card"><table><tr><th>Task</th><th>Calls</th><th>Cost</th></tr>${u.by_task.map(t=>`<tr><td>${t.task}</td><td>${t.calls}</td><td>${usd(t.cost)}</td></tr>`).join('')}</table></div>`}
 if(tab=='skills'){const s=await api('/v1/skills');v.innerHTML=`<div class="card"><table><tr><th>Skill</th><th>Description</th><th>Triggers</th></tr>${s.skills.map(k=>`<tr><td>${E(k.name)}</td><td>${E(k.description)}</td><td class="m">${E(k.triggers.join(', '))}</td></tr>`).join('')}</table>${Object.keys(s.errors).length?'<pre class="er">'+E(JSON.stringify(s.errors))+'</pre>':''}</div>`}
 if(tab=='jobs'){const j=await api('/v1/jobs');v.innerHTML=`<div class="card"><table><tr><th>Name</th><th>Kind</th><th>Spec</th><th>Last</th><th></th></tr>${j.map(x=>`<tr><td>${E(x.name)}</td><td>${x.kind}</td><td>${E(x.spec||'POST /v1/webhooks/'+x.name)}</td><td class="m">${E(x.last_status||'')}</td><td><button data-f="${x.name}">Fire</button> <button data-d="${x.name}">Delete</button></td></tr>`).join('')}</table></div>
  <div class="card"><div class="row"><input id="jn" placeholder="name"><select id="jk"><option>cron</option><option>webhook</option></select><input id="js" placeholder="*/10 * * * *"><input id="jp" placeholder="prompt ({input} = webhook body)" style="flex:1;min-width:200px"><button class="p" id="ja">Add</button><span id="je" class="er"></span></div></div>`;
  $('#ja').onclick=async()=>{try{await api('/v1/jobs',{method:'POST',body:JSON.stringify({name:$('#jn').value,kind:$('#jk').value,spec:$('#js').value,prompt:$('#jp').value})});show()}catch(e){$('#je').textContent=e.message}};
  v.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{await api('/v1/jobs/'+b.dataset.d,{method:'DELETE'});show()});
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{b.textContent='…';try{await api('/v1/jobs/'+b.dataset.f+'/fire',{method:'POST'})}catch(e){alert(e.message)}show()})}
 if(tab=='kb'){const nbs=await api('/v1/kb');v.innerHTML=`<div class="card"><div class="m">Notebooks: ${nbs.map(n=>E(n.notebook)+' ('+n.sources+')').join(', ')||'none yet'}</div><div class="row"><input id="kn" placeholder="notebook" value="default" style="width:130px"><input id="ks" placeholder="source name" style="width:170px"></div><textarea id="kt" placeholder="Paste source text to index…"></textarea><div class="row"><button id="ki">Index</button><input id="kq" placeholder="Ask a question about this notebook" style="flex:1;min-width:220px"><button class="p" id="ka">Ask</button><select id="kk"><option>briefing</option><option>faq</option><option>study_guide</option><option>timeline</option></select><button id="kg">Generate</button><span id="ke" class="m"></span></div></div><div id="ko"></div>`;
  const nb=()=>encodeURIComponent($('#kn').value.trim().toLowerCase()||'default');
  $('#ki').onclick=async()=>{try{const r=await api('/v1/kb/'+nb()+'/sources',{method:'POST',body:JSON.stringify({name:$('#ks').value,text:$('#kt').value})});$('#ke').textContent=r.status+' ('+r.chunks+' chunks)'}catch(e){$('#ke').textContent=e.message}};
  $('#kg').onclick=async()=>{$('#ke').textContent='generating…';try{const r=await api('/v1/kb/'+nb()+'/studio',{method:'POST',body:JSON.stringify({kind:$('#kk').value,focus:$('#kq').value})});$('#ke').textContent='';
   $('#ko').innerHTML=`<div class="card"><b class="${r.grounded?'ok':'er'}">${r.grounded?'Grounded in sources':'Not grounded'}</b><pre>${E(r.answer)}</pre></div>`}catch(e){$('#ke').textContent=e.message}};
  $('#ka').onclick=async()=>{$('#ke').textContent='asking…';try{const r=await api('/v1/kb/'+nb()+'/ask',{method:'POST',body:JSON.stringify({question:$('#kq').value})});$('#ke').textContent='';
   $('#ko').innerHTML=`<div class="card"><b class="${r.grounded?'ok':'er'}">${r.grounded?'Grounded in sources':'Not grounded: no verified citations'}</b><pre>${E(r.answer)}</pre></div>${r.citations.length?'<div class="card"><table>'+r.citations.map(c=>`<tr><td>[${c.n}]</td><td>${E(c.source)}#${c.chunk}</td><td class="m">${E(c.excerpt)}</td></tr>`).join('')+'</table></div>':''}`}catch(e){$('#ke').textContent=e.message}}}
 if(tab=='chat'){const sid=sessionStorage.getItem('sid')||('web-'+Math.random().toString(36).slice(2,10));sessionStorage.setItem('sid',sid);const h=await api('/v1/chat/'+sid);
  v.innerHTML=`<div class="card">${h.map(m=>`<p><b>${E(m.role)}</b><br>${E(m.text)}</p>`).join('')||'<span class="m">New session '+E(sid)+'. Prefix with ralph: / team: / plan: for modes.</span>'}</div><div class="card"><textarea id="cm"></textarea><div class="row"><button class="p" id="cs">Send</button><button id="cx">New session</button><span id="ce" class="m"></span></div></div>`;
  $('#cs').onclick=async()=>{$('#ce').textContent='thinking…';try{await api('/v1/chat/'+sid,{method:'POST',body:JSON.stringify({message:$('#cm').value})});show()}catch(e){$('#ce').textContent=e.message}};
  $('#cx').onclick=()=>{sessionStorage.removeItem('sid');show()}}
 if(tab=='ledger'){const[vf,l]=await Promise.all([api('/v1/ledger/verify'),api('/v1/ledger?limit=100')]);v.innerHTML=`<div class="card"><b class="${vf.ok?'ok':'er'}">${vf.ok?'Chain verified':'CHAIN BROKEN at seq '+vf.broken_at}</b> <span class="m">${vf.entries} entries</span></div>
  <div class="card"><table><tr><th>#</th><th>Run</th><th>Kind</th><th>Hash</th></tr>${l.map(x=>`<tr><td>${x.seq}</td><td>${x.run_id}</td><td>${x.kind}</td><td class="m">${x.hash.slice(0,16)}…</td></tr>`).join('')}</table></div>`}
 }catch(e){v.innerHTML=`<div class="card er">${E(e.message)}${/401/.test(e.message)||/token/.test(e.message)?' — enter the API token above and reopen the tab.':''}</div>`}}
const sandboxUI=()=>{if(tab!='approval'||!$('#aa')||$('#sandboxCtl'))return;const c=document.createElement('div');c.id='sandboxCtl';c.className='card';c.innerHTML='<b>Sandbox execution boundary</b><p class="m">Writes and rollback are bound to the selected sandbox. Provision one before persisting an approval.</p><div class="row"><input id="sourcePath" placeholder="Explicit source path to clone"><input id="sid" placeholder="Sandbox ID"><button class="p" id="provisionSandbox">Provision sandbox</button><button id="useSandbox">Use ID</button><button id="refreshSandboxes">Refresh health</button><span id="sandboxStatus" class="m"></span></div><div id="sandboxHealth" class="m">No sandbox selected</div><div id="sandboxList"></div>';$('#v').prepend(c);$('#sid').value=sessionStorage.getItem('sandbox_id')||'';const render=items=>{$('#sandboxList').innerHTML=items.length?'<table><tr><th>ID</th><th>Status</th><th>Expiry</th><th>Repository</th><th></th></tr>'+items.map(x=>`<tr><td>${E(x.sandbox_id.slice(0,12))}…</td><td>${E(x.status)}</td><td>${new Date(x.expires_at*1000).toISOString()}</td><td>${E(x.repository?.branch||x.repository?.status||'unknown')}</td><td><button data-select="${E(x.sandbox_id)}">Select</button> <button data-clean="${E(x.sandbox_id)}">Cleanup</button></td></tr>`).join('')+'</table>':'<span class="m">No managed sandboxes</span>';$('#sandboxList').querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{$('#sid').value=b.dataset.select;sessionStorage.setItem('sandbox_id',b.dataset.select);load()});$('#sandboxList').querySelectorAll('[data-clean]').forEach(b=>b.onclick=async()=>{if(!confirm('Cleanup this managed sandbox?'))return;try{await api('/v1/guard/sandboxes/'+b.dataset.clean+'?force=true',{method:'DELETE'});if(sessionStorage.getItem('sandbox_id')==b.dataset.clean){sessionStorage.removeItem('sandbox_id');$('#sid').value=''}load()}catch(e){$('#sandboxStatus').textContent=e.message}})};const load=async()=>{try{const r=await api('/v1/guard/sandboxes');render(r.sandboxes);const id=sessionStorage.getItem('sandbox_id');if(id){const s=r.sandboxes.find(x=>x.sandbox_id==id);$('#sandboxHealth').textContent=s?`Active sandbox: ${s.status} · expires ${new Date(s.expires_at*1000).toISOString()} · ${s.root}`:'Selected sandbox not found';}}catch(e){$('#sandboxStatus').textContent=e.message}};$('#useSandbox').onclick=()=>{const id=$('#sid').value.trim();if(!id){$('#sandboxStatus').textContent='Sandbox ID required';return}sessionStorage.setItem('sandbox_id',id);$('#sandboxStatus').textContent='Selected '+id;load()};$('#refreshSandboxes').onclick=load;$('#provisionSandbox').onclick=async()=>{const source=$('#sourcePath').value.trim();if(!source){$('#sandboxStatus').textContent='Enter an explicit source path before provisioning';return}try{const r=await api('/v1/guard/sandboxes',{method:'POST',body:JSON.stringify({source})});sessionStorage.setItem('sandbox_id',r.sandbox_id);$('#sid').value=r.sandbox_id;$('#sandboxStatus').textContent='Provisioned and selected · expires '+new Date(r.expires_at*1000).toISOString();load()}catch(e){$('#sandboxStatus').textContent=e.message}};load()};new MutationObserver(sandboxUI).observe($('#v'),{childList:true,subtree:true});
fetch('/health').then(r=>r.json()).then(h=>$('#hl').textContent=`provider: ${h.provider} · auth: ${h.auth} · skills: ${h.skills}`);show();
</script></body></html>
